  function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function drawReplica(){
    if(!Array.isArray(d.p)||!d.p.length)return;

    document.getElementById('erTabs').innerHTML=[0,1].map(t=>'<div class="erTeamSummary '+(t===0?'teamA':'teamB')+'">'+esc(d.names[t])+' <b>'+d.p.filter(x=>x.t===t).length+'명</b></div>').join('');

  }

<script>
/* v28 안정화: 활동 입력값은 화면을 다시 그려도 유지한다. */
const v28Drafts={};
function v28ReadDraft(){
  const box=$('#opts');
  if(!box)return;
  if(act==='일반 게임'||act==='랭크 게임')v28Drafts[act]={
    kill:$('#kill')?.value??'0',assist:$('#assist')?.value??'0',
    top:!!$('#top')?.checked,chick:!!$('#chick')?.checked,dead:!!$('#dead')?.checked
  };
  else if(act==='수련의 방')v28Drafts[act]={fb:document.querySelector('[name=fb]:checked')?.value??'20'};
  else if(act==='참교육')v28Drafts[act]={edu:document.querySelector('[name=edu]:checked')?.value??'0'};
  else if(act==='혈맹전쟁'||act==='공성전')v28Drafts[act]={bonus:!!$('#bonus')?.checked};
}
const v28TimerOpts=opts;
opts=function(){
  if(act==='타이머')return v28TimerOpts();
  const v=v28Drafts[act]||{};
  let html='';
  if(act==='일반 게임'||act==='랭크 게임')html='킬 <input id="kill" type="number" min="0" value="'+(v.kill??'0')+'"> 어시 <input id="assist" type="number" min="0" value="'+(v.assist??'0')+'"><label><input id="top" type="checkbox" '+(v.top?'checked':'')+'>탑텐</label><label><input id="chick" type="checkbox" '+(v.chick?'checked':'')+'>치킨</label><label><input id="dead" type="checkbox" '+(v.dead?'checked':'')+'>데스</label>';
  else if(act==='수련의 방')html='<label><input type="radio" name="fb" value="20" '+((v.fb??'20')==='20'?'checked':'')+'>피드백 받는 학생 +20</label><label><input type="radio" name="fb" value="15" '+(v.fb==='15'?'checked':'')+'>피드백 주는 교수 +15</label>';
  else if(act==='참교육')html='<label><input type="radio" name="edu" value="0" '+((v.edu??'0')==='0'?'checked':'')+'>성공: 상대 학생 참가 경험치 무효</label><label><input type="radio" name="edu" value="-20" '+(v.edu==='-20'?'checked':'')+'>실패: -20 XP</label>';
  else if(act==='혈맹전쟁')html='<label><input id="bonus" type="checkbox" '+(v.bonus?'checked':'')+'>승리팀 +200</label>크루룰 개인 +100';
  else if(act==='공성전')html='<label><input id="bonus" type="checkbox" '+(v.bonus?'checked':'')+'>승리팀 +200</label>워크룰 개인 +200';
  $('#opts').innerHTML=html;
  calc();
};
document.addEventListener('input',e=>{if(e.target.closest('#opts')){v28ReadDraft();calc()}},true);
document.addEventListener('change',e=>{if(e.target.closest('#opts')){v28ReadDraft();calc()}},true);
window.addEventListener('beforeunload',v28ReadDraft);
render();
</script>

const v32Render=render;
render=function(){
  v32Render();
  document.querySelectorAll('#board .teamSummary').forEach((summary,teamIndex)=>{
    const memberXp=d.p.filter(member=>member.t===teamIndex).reduce((sum,member)=>sum+member.x,0);
    const level=Math.floor(memberXp/200)+1;
    const progress=Math.min(99,Math.floor(((memberXp%200)/200)*100));
    const levelEl=summary.querySelector('.teamLv');

    if(levelEl)levelEl.innerHTML='<span class="lvLabel">LV</span><span class="lvNumber">'+level+'</span>';
    if(percentEl)percentEl.textContent=progress+'%';
    if(totalEl)totalEl.textContent='팀원 합산 '+memberXp+'점';
  });
};

<script>
/* v54: 관리자 편집 안정화 + 수동 경험치 관리 화면 제거 */
document.addEventListener('DOMContentLoaded',()=>{
  const style=document.createElement('style');
  style.textContent='#manual,#manualV,#manualR,#manualGo,.manualTeamGuide,.manualEditRow{display:none!important}#admin .admin .panel:last-child>h2{display:none!important}';
  document.head.append(style);

  // render가 1초 타이머 등으로 반복되어도 관리자 입력 중인 초안 전체를 보존한다.
  const protectedIds=['n0','n1','p0','p1','teamNameAInput','teamNameBInput'];
  const priorRender=render;
  render=function(){
    const active=document.activeElement;
    const editing=active&&protectedIds.includes(active.id);
    const draft=editing?Object.fromEntries(protectedIds.map(id=>{
      const el=document.getElementById(id);
      return [id,el?el.value:null];
    })):null;
    const activeId=editing?active.id:null;
    const start=editing&&typeof active.selectionStart==='number'?active.selectionStart:null;
    const end=editing&&typeof active.selectionEnd==='number'?active.selectionEnd:null;
    priorRender();
    if(!draft)return;
    for(const [id,value] of Object.entries(draft)){
      if(value===null)continue;
      const el=document.getElementById(id);
      if(el)el.value=value;
    }
    const focusEl=document.getElementById(activeId);
    if(focusEl){
      try{focusEl.focus({preventScroll:true})}catch(_){focusEl.focus()}
      if(start!==null&&typeof focusEl.setSelectionRange==='function'){
        const max=focusEl.value.length;
        focusEl.setSelectionRange(Math.min(start,max),Math.min(end,max));
      }
    }
  };
});
</script>

  function syncAdminEnhanceSelect(force=false){
    const sel=document.getElementById('adminEnhanceStudent');
    if(!sel || !window.d || !Array.isArray(d.p)) return;

    const signature=d.p.map((p,i)=>i+':'+p.n+':'+p.t).join('|');
    if(!force && sel.dataset.signature===signature) return;

    const current=sel.value;
    sel.innerHTML=d.p.map((p,i)=>{
      const team=d.names?.[p.t] ?? ((p.t||0)+1)+'팀';
      return '<option value="'+i+'">'+p.n+' · '+team+'</option>';
    }).join('');
    sel.dataset.signature=signature;

    if(current!=='' && d.p[Number(current)]) sel.value=current;
    else if(d.p.length) sel.value='0';
  }

  // 학생 드롭다운 조작 중에는 다른 전역 change/click 핸들러가 끼어들지 못하게 처리
  const adminSel=document.getElementById('adminEnhanceStudent');
  if(adminSel){
    ['mousedown','pointerdown','click'].forEach(type=>{
      adminSel.addEventListener(type,e=>{
        e.stopPropagation();
      });
    });

    adminSel.addEventListener('change',e=>{
      e.stopImmediatePropagation();
      const i=Number(adminSel.value);
      const p=d.p[i];
      if(!p) return;
      const w=document.getElementById('adminWeaponLv');
      const a=document.getElementById('adminArmorLv');

  function protectGameInput(el){
    ['mousedown','pointerdown','click','focus'].forEach(type=>{
      el.addEventListener(type,e=>{
        e.stopPropagation();
      });
    });

    el.addEventListener('input',e=>{
      e.stopImmediatePropagation();
      try{ calc(); }catch(_){}
    });

    el.addEventListener('change',e=>{
      e.stopImmediatePropagation();
      try{ calc(); }catch(_){}
    });
  }

  function bindGameInputs(){
    ['kill','assist'].forEach(id=>{
      const el=document.getElementById(id);
      if(!el || el.dataset.stableBound==='1') return;

<script>
function draw(state){
  const root=document.getElementById('teams');
  if(!state||!Array.isArray(state.people))return;
  root.innerHTML=[0,1].map(t=>{
    const members=state.people.filter(p=>p.t===t);
    return '<section class="team"><div class="teamTitle">'+(state.names[t]||((t+1)+'팀'))+'</div>'+
      members.map(p=>'<div class="row"><span class="name">'+p.n+'<small class="xp">'+p.x+' XP</small></span><span class="w">무기 +'+p.weaponLv+'</span><span class="a">방어구 +'+p.armorLv+'</span></div>').join('')+
    '</section>';
  }).join('');
}
window.addEventListener('message',e=>{
  if(e.data && e.data.kind==='baiple-enhance-status') draw(e.data.data);
});
window.opener && window.opener.postMessage({kind:'baiple-enhance-status-ready'},'*');
<\/script>

    <div class="forgePopupInfo"><div><small>현재 단계</small><b id="forgePopupLevel"></b></div><div><small>보유 경험치</small><b id="forgePopupXp"></b></div></div>
    <button type="button" id="forgeConfirm">강화하기</button>
    <div id="forgePopupResult" class="forgePopupResult"></div>
  </section>
</div>

<script>
/* v76: 무기·방어구 강화 확인 팝업과 무음 드워프 영상 */
(()=>{
  const modal=document.getElementById('forgeConfirmModal'),video=document.getElementById('forgeDwarfVideo');
  if(!modal||!video)return;
  const videoResult=document.createElement('div');videoResult.id='forgeVideoResult';videoResult.className='forgeVideoResult';video.parentElement.appendChild(videoResult);
  let pendingType='weapon',running=false;
  const close=()=>{if(running)return;video.pause();modal.classList.remove('on');modal.setAttribute('aria-hidden','true')};
  function open(type){
    const p=d.p[who];if(!p)return;
    pendingType=type;running=false;
    const lv=Number(type==='weapon'?p.weaponLv:p.armorLv)||0;
    document.getElementById('forgeConfirmTitle').textContent=type==='weapon'?'🗡️ 무기 강화':'🛡️ 방어구 강화';
    document.getElementById('forgeConfirmWho').textContent=p.n+' · 강화할 준비가 되었습니다.';
    document.getElementById('forgePopupLevel').textContent='+'+lv+' → +'+Math.min(3,lv+1);
    document.getElementById('forgePopupXp').textContent=Number(p.x).toLocaleString('ko-KR')+' EXP';
    document.getElementById('forgePopupResult').textContent='';
    document.getElementById('forgePopupResult').className='forgePopupResult';
    videoResult.textContent='';videoResult.className='forgeVideoResult';
    const confirm=document.getElementById('forgeConfirm');confirm.disabled=lv>=3;confirm.textContent=lv>=3?'최대 강화 단계':'강화하기';
    video.pause();video.currentTime=0;modal.classList.add('on');modal.setAttribute('aria-hidden','false');
  }
  document.addEventListener('click',e=>{
    const openButton=e.target.closest('[data-open-forge]');
    if(openButton){e.preventDefault();e.stopImmediatePropagation();open(openButton.dataset.openForge);return}
    if(e.target.closest('#forgeConfirmClose')){e.preventDefault();close();return}
    if(e.target===modal){close();return}
    const confirm=e.target.closest('#forgeConfirm');if(!confirm||running)return;
    e.preventDefault();e.stopImmediatePropagation();
    /* 다시 강화할 때 이전 성공·실패 화면과 문구를 먼저 완전히 초기화 */
    videoResult.textContent='';
    videoResult.className='forgeVideoResult';
    const priorResult=document.getElementById('forgePopupResult');
    priorResult.textContent='';
    priorResult.className='forgePopupResult';
    video.pause();
    video.currentTime=0;
    running=true;confirm.disabled=true;confirm.textContent='강화 중...';
    video.muted=true;video.play().catch(()=>{});
    setTimeout(()=>{
      const actual=document.createElement('button');actual.type='button';actual.id=pendingType==='weapon'?'weaponUpgrade':'armorUpgrade';actual.hidden=true;document.body.appendChild(actual);actual.click();actual.remove();
      setTimeout(()=>{
        const source=document.getElementById('forgeResult'),success=source?.classList.contains('success');
        const message=success?'✨ 강화 성공!':'💥 강화 실패';
        setTimeout(()=>{
          const result=document.getElementById('forgePopupResult');
          video.pause();videoResult.textContent=message;videoResult.className='forgeVideoResult show '+(success?'success':'fail');
          result.textContent=source?.textContent||message;result.className='forgePopupResult '+(success?'success':'fail');
          const p=d.p[who];document.getElementById('forgePopupXp').textContent=Number(p.x).toLocaleString('ko-KR')+' EXP';
          running=false;confirm.disabled=false;confirm.textContent='다시 강화하기';
        },2550);
      },120);
    },650);
  },true);
  video.addEventListener('ended',()=>{if(running){video.currentTime=0;video.play().catch(()=>{})}});
})();
</script>
