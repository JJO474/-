const K='sneage3',A=['일반 게임','랭크 게임','수련의 방','정령 시스템','참교육','혈맹전쟁','공성전','타이머'],$=x=>document.querySelector(x),f=s=>[s/3600|0,s/60%60|0,s%60].map(x=>String(x).padStart(2,'0')).join(':');
let d=JSON.parse(localStorage.getItem(K)||'null')||{names:['쪼치원','오치원'],end:Date.now()+36000000,p:[['호랑이',0],['여우',0],['토끼',0],['곰',0],['수달',0],['고양이',1],['강아지',1],['판다',1],['늑대',1],['펭귄',1]].map(x=>({n:x[0],t:x[1],x:0,tm:36000,go:false})),l:[],bonus:[0,0]};let who=0,act=A[0];function save(){localStorage.setItem(K,JSON.stringify(d))}function total(t){return d.p.filter(x=>x.t==t).reduce((a,x)=>a+x.x,0)+d.bonus[t]}

<script>
/* v28 안정화: 활동 입력값은 화면을 다시 그려도 유지한다. */
const v28Drafts={};
function v28ReadDraft(){
  const box=$('#opts');
  if(!box)return;
  if(act==='일반 게임'||act==='랭크 게임')v28Drafts[act]={
    kill:$('#kill')?.value??'0',assist:$('#assist')?.value??'0',
    top:!!$('#top')?.checked,chick:!!$('#chick')?.checked,dead:!!$('#dead')?.checked
  };
  else if(act==='수련의 방')v28Drafts[act]={fb:document.querySelector('[name=fb]:checked')?.value??'20'};
  else if(act==='참교육')v28Drafts[act]={edu:document.querySelector('[name=edu]:checked')?.value??'0'};
  else if(act==='정령 시스템')v28Drafts[act]={custom:$('#custom')?.value??'10'};
  else if(act==='혈맹전쟁'||act==='공성전')v28Drafts[act]={bonus:!!$('#bonus')?.checked};
}
const v28TimerOpts=opts;
opts=function(){
  if(act==='타이머')return v28TimerOpts();
  const v=v28Drafts[act]||{};
  let html='';
  if(act==='일반 게임'||act==='랭크 게임')html='킬 <input id="kill" type="number" min="0" value="'+(v.kill??'0')+'"> 어시 <input id="assist" type="number" min="0" value="'+(v.assist??'0')+'"><label><input id="top" type="checkbox" '+(v.top?'checked':'')+'>탑텐</label><label><input id="chick" type="checkbox" '+(v.chick?'checked':'')+'>치킨</label><label><input id="dead" type="checkbox" '+(v.dead?'checked':'')+'>데스</label>';
  else if(act==='수련의 방')html='<label><input type="radio" name="fb" value="20" '+((v.fb??'20')==='20'?'checked':'')+'>피드백 받는 학생 +20</label><label><input type="radio" name="fb" value="15" '+(v.fb==='15'?'checked':'')+'>피드백 주는 교수 +15</label>';
  else if(act==='참교육')html='<label><input type="radio" name="edu" value="0" '+((v.edu??'0')==='0'?'checked':'')+'>성공: 상대 학생 참가 경험치 무효</label><label><input type="radio" name="edu" value="-20" '+(v.edu==='-20'?'checked':'')+'>실패: -20 XP</label>';
  else if(act==='정령 시스템')html='지정 XP <input id="custom" type="number" value="'+(v.custom??'10')+'">';
  else if(act==='혈맹전쟁')html='<label><input id="bonus" type="checkbox" '+(v.bonus?'checked':'')+'>승리팀 +200</label>크루룰 개인 +100';
  else if(act==='공성전')html='<label><input id="bonus" type="checkbox" '+(v.bonus?'checked':'')+'>승리팀 +200</label>워크룰 개인 +200';
  $('#opts').innerHTML=html;
  calc();
};
document.addEventListener('input',e=>{if(e.target.closest('#opts')){v28ReadDraft();calc()}},true);
document.addEventListener('change',e=>{if(e.target.closest('#opts')){v28ReadDraft();calc()}},true);
window.addEventListener('beforeunload',v28ReadDraft);
render();
</script>

<script>
/* v32: 팀원 경험치 합산 기준의 팀 레벨 · 다음 레벨 진행률 */
const v32Render=render;
render=function(){
  v32Render();
  document.querySelectorAll('#board .teamSummary').forEach((summary,teamIndex)=>{
    const memberXp=d.p.filter(member=>member.t===teamIndex).reduce((sum,member)=>sum+member.x,0);
    const level=Math.floor(memberXp/200)+1;
    const progress=Math.min(99,Math.floor(((memberXp%200)/200)*100));
    const levelEl=summary.querySelector('.teamLv');
    const percentEl=summary.querySelector('.teamPct');
    const totalEl=summary.querySelector('.teamTotal');
    if(levelEl)levelEl.innerHTML='<span class="lvLabel">LV</span><span class="lvNumber">'+level+'</span>';
    if(percentEl)percentEl.textContent=progress+'%';
    if(totalEl)totalEl.textContent='팀원 합산 '+memberXp+'점';
  });
};

v32LogoStyle.textContent='.top .logo img{filter:drop-shadow(0 2px 2px #000)!important}.top .logo{flex-shrink:0!important}.top .logo img{max-width:none!important}';
document.head.append(v32LogoStyle);
render();

<script>

document.addEventListener('DOMContentLoaded',()=>{
  const fmt=seconds=>[Math.floor(seconds/3600),Math.floor(seconds/60)%60,seconds%60].map(n=>String(Math.max(0,n)).padStart(2,'0')).join(':');
  const panel=document.querySelector('#admin .admin .panel:last-child');
  if(panel&&!document.getElementById('operationApply')){
    const box=document.createElement('section');
    box.className='operationSetup';
    box.innerHTML='<h2>운영시간 타이머</h2><p>시간 · 분 · 초를 입력한 뒤 적용하면 바로 시작됩니다.</p><div><label>시간 <input id="operationHour" type="number" min="0" value="0"></label><label>분 <input id="operationMinute" type="number" min="0" max="59" value="0"></label><label>초 <input id="operationSecond" type="number" min="0" max="59" value="0"></label></div><button id="operationApply" class="gold">타이머 적용 · 시작</button><button id="operationToggle">일시정지</button>';
    panel.prepend(box);
    const fill=()=>{$('#operationHour').value=Math.floor((d.master||0)/3600);$('#operationMinute').value=Math.floor((d.master||0)/60)%60;$('#operationSecond').value=(d.master||0)%60};
    fill();
    $('#operationApply').onclick=()=>{const h=Math.max(0,+$('#operationHour').value||0),m=Math.min(59,Math.max(0,+$('#operationMinute').value||0)),s=Math.min(59,Math.max(0,+$('#operationSecond').value||0));d.master=Math.floor(h*3600+m*60+s);d.masterRun=d.master>0;save();placeTimer();flash($('#operationApply'),'운영 타이머를 시작했습니다')};
    $('#operationToggle').onclick=()=>{d.masterRun=!d.masterRun;save();$('#operationToggle').textContent=d.masterRun?'일시정지':'다시 시작';placeTimer()};
  }
  const css=document.createElement('style');
  css.textContent='.operationSetup{margin:0 0 18px;padding:14px;border:2px solid #b682df;border-radius:14px;background:#f5eaff}.operationSetup h2{margin:0 0 5px}.operationSetup p{margin:0 0 10px}.operationSetup label{display:inline-flex!important;align-items:center;gap:5px;margin:0 8px 10px 0!important}.operationSetup input{width:60px!important;margin:0!important;text-align:center}.boardOperationTimer{margin:0 0 9px;padding:7px 9px;border:2px solid #e6c369;border-radius:8px;background:#17253c;color:#ffeaa4;text-align:left;font-size:12px;font-weight:800}.boardOperationTimer b{display:inline;font:18px Georgia,serif;color:#fff;margin-left:6px}';document.head.append(css);
  function placeTimer(){
    const board=document.querySelector('#live .board');if(!board)return;
    let timer=board.querySelector('.boardOperationTimer');
    if(!timer){timer=document.createElement('div');timer.className='boardOperationTimer';board.insertBefore(timer,board.firstChild)}
    timer.innerHTML='운영시간 <b>'+fmt(d.master||0)+'</b>';
  }
  placeTimer();
  setInterval(placeTimer,250);
});
</script>

<script>
/* v52: 팀 이름 저장 버튼 최종 연결 */
document.addEventListener('DOMContentLoaded',()=>{
  const inputs=[$('#teamNameAInput'),$('#teamNameBInput')];
  const oldButton=$('#applyTeamSettings');
  if(!inputs.every(Boolean)||!oldButton)return;
  const button=oldButton.cloneNode(true);
  button.id='applyTeamNamesFinal';button.textContent='팀 이름·학생 명단 적용';
  oldButton.replaceWith(button);
  button.addEventListener('click',event=>{
    event.preventDefault();event.stopImmediatePropagation();
    const names=inputs.map(input=>input.value.trim());
    if(!names[0]||!names[1])return alert('두 팀의 이름을 모두 입력하세요.');
    const groups=[$('#p0').value,$('#p1').value].map(text=>text.split('\n').map(name=>name.trim()).filter(Boolean));
    const old=d.p;
    d.names=names;
    d.p=groups.flatMap((people,team)=>people.map(name=>{const previous=old.find(member=>member.n===name);return {n:name,t:team,x:previous?.x||0,tm:previous?.tm||36000,go:false}}));
    who=0;save();render();
    inputs.forEach((input,index)=>input.value=d.names[index]);
    flash(button,'팀 이름이 저장되었습니다');
  },true);
});
</script>
<script>
/* v50: 관리자 팀 입력 중 자동 화면 갱신으로 인한 값 초기화 방지 */
document.addEventListener('DOMContentLoaded',()=>{
  const priorRender=render;
  render=function(){
    const active=document.activeElement;
    const editable=active&&['n0','n1','p0','p1'].includes(active.id);
    const draft=editable?{id:active.id,value:active.value,start:active.selectionStart,end:active.selectionEnd}:null;
    priorRender();
    if(!draft)return;
    const field=document.getElementById(draft.id);
    if(!field)return;
    field.value=draft.value;
    field.focus();
    if(typeof field.setSelectionRange==='function')field.setSelectionRange(draft.start,draft.end);
  };
});
</script>
